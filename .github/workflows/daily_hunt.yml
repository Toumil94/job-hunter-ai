# =============================================================================
# 🤖 GitHub Actions — Job Hunter AI tourne automatiquement et gratuitement
# =============================================================================
# Ce workflow s'exécute 2x par jour (7h et 18h CET) sur les serveurs GitHub.
# ✅ GRATUIT: 2000 minutes/mois sur le plan gratuit GitHub
# 
# SETUP:
# 1. Pousse ce repo sur GitHub
# 2. Va dans Settings → Secrets and variables → Actions
# 3. Ajoute ces secrets:
#    - GROQ_API_KEY        (gratuit, https://console.groq.com) ou ANTHROPIC_API_KEY
#    - ADZUNA_APP_ID
#    - ADZUNA_APP_KEY
#    - EMAIL_SENDER
#    - EMAIL_APP_PASSWORD
#    - EMAIL_RECIPIENT

name: 🤖 Job Hunter AI

on:
  # Exécution programmée (UTC → +1h pour CET, +2h pour CEST)
  schedule:
    # 6h UTC = 7h CET (scan quotidien du matin)
    - cron: '0 6 * * *'
  
  # Permet aussi le lancement manuel
  workflow_dispatch:
    inputs:
      command:
        description: 'Commande à exécuter'
        required: true
        default: 'hunt'
        type: choice
        options:
          - hunt
          - scan
          - followup
          - stats

# Le suivi des candidatures reste dans le cache privé de GitHub Actions :
# il n'est jamais publié dans le dépôt.
permissions:
  contents: read

jobs:
  job-hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      # 1. Récupérer le code
      - name: 📥 Checkout
        uses: actions/checkout@v5
      
      # 2. Python
      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      
      # 3. Dépendances
      - name: 📦 Install dependencies
        run: pip install -r requirements.txt
      
      # 4. Restaurer la base de données des candidatures
      - name: 💾 Restore application database
        uses: actions/cache@v4
        with:
          path: data/applications.json
          key: applications-v2-${{ github.run_number }}
          restore-keys: |
            applications-v2-
      
      # 5. Déterminer la commande à exécuter
      - name: 🎯 Determine command
        id: command
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "cmd=${{ github.event.inputs.command }}" >> $GITHUB_OUTPUT
          else
            echo "cmd=hunt" >> $GITHUB_OUTPUT
          fi
      
      # 6. Lancer Job Hunter AI
      - name: 🤖 Run Job Hunter AI (${{ steps.command.outputs.cmd }})
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: python -m src.main ${{ steps.command.outputs.cmd }}
