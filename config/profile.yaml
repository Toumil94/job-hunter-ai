  elevator_pitch_fr: |
    Data & AI Engineer avec 3 ans d'expérience chez EssilorLuxottica (190 000 collaborateurs),
    spécialisé dans le développement de systèmes RAG en production (-30% temps de recherche),
    le benchmarking et l'optimisation de LLMs, et le déploiement de pipelines data à l'échelle
    internationale (3 régions). Certifié Azure et Databricks, j'ai également piloté une migration
    BI complète pour les équipes métiers Europe. Disponible immédiatement en Suisse Romande
    (frontalier, éligible permis G).

  # Pitch EN
  elevator_pitch_en: |
    Data & AI Engineer with 3 years of experience at EssilorLuxottica (190,000 employees),
    specialized in production RAG systems (30% reduction in search time), LLM benchmarking
    and optimization, and international-scale data pipelines across 3 regions. Azure and
    Databricks certified, I also led an end-to-end BI migration for European business teams.
    Available immediately in Western Switzerland (cross-border, eligible for G permit).

  # Phrase d'accroche LinkedIn FR
  linkedin_hook_fr: |
    Bonjour {hiring_manager}, je suis Data & AI Engineer avec 3 ans d'expérience chez
    EssilorLuxottica, spécialisé en RAG et LLMs. Votre offre de {job_title} chez {company}
    correspond parfaitement à mon profil. J'ai notamment déployé un chatbot RAG en production
    ayant réduit de 30% le temps de recherche. J'aimerais échanger avec vous à ce sujet.

  # Phrase d'accroche LinkedIn EN
  linkedin_hook_en: |
    Hi {hiring_manager}, I'm a Data & AI Engineer with 3 years at EssilorLuxottica,
    specialized in RAG and LLMs. Your {job_title} role at {company} is a strong match
    for my profile — I deployed a production RAG chatbot that cut search time by 30%.
    I'd love to connect and discuss further.
